name: SG Pools Scraper & Telegram Notifier

on:
  schedule:
    # Runs at 7:45 PM Singapore Time on Wednesday, Saturday, and Sunday
    - cron: '45 11 * * 3,6,0'
  workflow_dispatch: # Allows you to test it manually with a button click

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Check out Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Scraping Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # HERE IS THE STEP FROM YOUR PROMPT:
    - name: Run Scraper and Check Wins
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python scraper.py

    - name: Save Updated Results to GitHub
      run: |
        git config --global user.name "GitHub Automation Bot"
        git config --global user.email "actions@github.com"
        git add data/*.json
        git commit -m "Automated update of lottery results [skip ci]" || exit 0
        git push
